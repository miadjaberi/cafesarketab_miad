name: restore-index
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-index.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore healthy index.html
        run: |
          set -e
          git checkout e06e7cda9acb -- index.html
          if git diff --cached --quiet; then
            echo "index already matches good commit"
            exit 0
          fi
          git config user.name "kafe-restore"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "restore: index.html کامل از e06e7 — حذف لودر CDN"
          git push origin HEAD:main
