name: Deploy QA preview (live visual)
on:
  workflow_dispatch:
  push:
    branches:
      - fix/qa-harness-2026-11-07
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-qa-preview
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/qa-harness-2026-11-07
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
