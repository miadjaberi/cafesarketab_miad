<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>اسرار ازل</title>
<meta name="description" content="اسرار ازل — سرکتاب، رمل و مکاشفه">
<meta name="theme-color" content="#0a0818">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="اسرار ازل">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
<symbol id="bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0112 0v5l2 2H4z"/><path d="M10 21h4"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="book" viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-9-2v14c4 0 7 .5 9 2 2-1.5 5-2 9-2V4c-4 0-7 .5-9 2zM12 6v14"/></symbol>
<symbol id="cup" viewBox="0 0 24 24"><path d="M4 9h13v4a5 5 0 01-5 5H9a5 5 0 01-5-5zM17 10h2a2 2 0 010 4h-2M3 21h16"/></symbol>
<symbol id="star" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5l-5.3 2.9 1.2-6-4.5-4.1 6-.7z"/></symbol>
<symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c3 0 4.5 1.8 4.5 4.5"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></symbol>
<symbol id="compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="books" viewBox="0 0 24 24"><rect x="4" y="3" width="7" height="18" rx="1"/><path d="M14 6l5 1-3 14-5-1"/></symbol>
<symbol id="cl" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="cr" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
<symbol id="sp" viewBox="0 0 24 24"><path d="M12 2l1.5 5h5l-4 3.5 1.5 5L12 12.5 8 15.5l1.5-5-4-3.5h5z"/></symbol>
</defs></svg>

<div class="stage">
 <div class="phone"><div class="screen">
  <div class="scroll">
   <header>
    <div class="circ" id="lw"><svg class="i"><use href="#user"/></svg></div>
    <div class="ttl"><div><b id="bn1"></b><small id="bn2"></small></div><svg id="lg" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 6c1 4 3 6 6 7-3 1-5 3-6 7-1-4-3-6-6-7 3-1 5-3 6-7zM6 22c5-1 10 0 14 4 4-4 9-5 14-4v10c-5-1-10 0-14 3-4-3-9-4-14-3z"/><path d="M20 26v10"/></svg></div>
    <div class="hr"><span class="bell"><svg class="i"><use href="#bell"/></svg></span><svg class="i"><use href="#search"/></svg></div>
   </header>

   <div class="banner" id="bn">
    <div class="track" id="tr"></div>
    <button class="arr" style="left:4px" data-b="-1"><svg class="i"><use href="#cl"/></svg></button>
    <button class="arr" style="right:4px" data-b="1"><svg class="i"><use href="#cr"/></svg></button>
   </div>
   <div class="dots" id="dots"></div>

   <div class="quick" id="qk"></div>

   <div class="sec"><a data-go="lib" href="#"><span id="al">مشاهده همه</span><svg class="i"><use href="#cl"/></svg></a><h3><span id="st">محصولات و پیشنهادها</span><svg class="i"><use href="#sp"/></svg></h3></div>
   <div class="cv" id="cv">
    <button class="arr" style="left:-6px" data-c="-1"><svg class="i"><use href="#cl"/></svg></button>
    <button class="arr" style="right:-6px" data-c="1"><svg class="i"><use href="#cr"/></svg></button>
   </div>

   <div class="today" id="td">
    <button class="arr" style="left:4px" data-t="-1"><svg class="i"><use href="#cl"/></svg></button>
    <button class="arr" style="right:0;color:#b9a8ff" data-t="1"><svg class="i"><use href="#cr"/></svg></button>
    <div class="tx" id="tx"></div>
   </div>
  </div>

  <button class="fab" id="fab" aria-label="پیام">💬</button>
  <div class="mo" id="mo"></div>
  <div class="pg" id="pg"></div>

  <nav>
   <button class="on" data-n="0"><svg class="i"><use href="#home"/></svg>خانه</button>
   <button data-n="1"><svg class="i"><use href="#book"/></svg>فروشگاه</button>
   <button class="plus" data-n="2" aria-label="افزودن"><svg class="i"><use href="#plus"/></svg></button>
   <button data-n="3"><svg class="i"><use href="#star"/></svg>مودال‌ها</button>
   <button data-n="4"><svg class="i"><use href="#user"/></svg>پروفایل</button>
  </nav>
 </div></div>
</div>
<div id="adm"><div class="ap" id="ap"></div></div>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
</script>
</body>
</html>
