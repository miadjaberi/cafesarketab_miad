ann:{on:'0',t:'اعلان ویژه',b:'متن اعلان را از پنل مدیریت وارد کنید.',btn:'متوجه شدم'},set:{slide:5,cards:6,pin:'1234',logoPos:'l',logoSize:36},
modals:[{t:'ابجد و حروف',s:'ابزار تخصصی',b:'توضیحات از پنل مدیریت قابل ویرایش است.'},{t:'رمل امام علی',s:'ابزار تخصصی',b:'توضیحات از پنل مدیریت قابل ویرایش است.'},{t:'دلیل الحیران',s:'ابزار تخصصی',b:'توضیحات از پنل مدیریت قابل ویرایش است.'},{t:'همزاد قرین',s:'ابزار تخصصی',b:'توضیحات از پنل مدیریت قابل ویرایش است.'},{t:'اسماء الحسنی',s:'ابزار تخصصی',b:'توضیحات از پنل مدیریت قابل ویرایش است.'}],
plans:[{t:'اشتراک یک‌ماهه',price:'۰ تومان',d:'توضیحات از پنل مدیریت قابل ویرایش است.'},{t:'اشتراک سه‌ماهه',price:'۰ تومان',d:'توضیحات از پنل مدیریت قابل ویرایش است.'},{t:'اشتراک یک‌ساله',price:'۰ تومان',d:'توضیحات از پنل مدیریت قابل ویرایش است.'}],
};
let C=structuredClone(D),bi=0,ci=0,nav=0;
function render(){
 $('#bn1').textContent=C.brand.name;$('#bn2').textContent=C.brand.sub;
 const tr=$('#tr');tr.innerHTML='';
 C.banners.forEach((b,i)=>{
  const d=document.createElement('div');d.className='slide s'+(i%4);
  d.innerHTML=`<div class="bt"><h2>${b.t.replace(/\\n/g,'<br>')}</h2><p>${b.p}</p><button data-go="${b.go||''}">${b.b}</button></div>`;
  tr.appendChild(d);
 });
 $('#dots').innerHTML=C.banners.map((_,i)=>`<i class="${i===bi?'on':''}"></i>`).join('');
 tr.style.transform=`translateX(${-bi*100}%)`;
 $('#qk').innerHTML=C.quick.map(q=>`<a data-go="${q.pg}"><b>${q.t}</b><small>${q.s}</small></a>`).join('');
 $('#st').textContent=C.secT;$('#al').textContent=C.all;
 const cv=$('#cv');cv.querySelectorAll('.card').forEach(e=>e.remove());
 C.books.forEach((bk,i)=>{
  const c=document.createElement('div');c.className='card';
  const off=i-ci;c.style.transform=`translateX(calc(-50% + ${off*150}px)) scale(${off===0?1:0.85})`;c.style.opacity=Math.abs(off)>1?0:1;c.style.zIndex=10-Math.abs(off);
  const cover=bk.img?`<img src="${bk.img}" alt="" style="width:100%;height:100%;object-fit:cover">`:`<span>بدون تصویر</span>`;c.innerHTML=`<div class="ci">${cover}</div><div class="ct"><b>${bk.t}</b><small>${bk.a}</small></div>`;
  cv.appendChild(c);
 });
 $('#tt').textContent=C.acts.title;
 const day=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'][new Date().getDay()];
 const z=C.zekrs.find(x=>x.day===day)||C.zekrs[0];
 $('#tp').textContent=(z?z.z:'')+' — '+(z?z.am:'');
 if(C.welcome.on==='1' && !sessionStorage.getItem('asrar_welcomed')){
  $('#wt').textContent=C.welcome.t;
  $('#wb').textContent=C.welcome.b;
  $('#wbtn').textContent=C.welcome.btn||'موافقم';
  $('#wm').classList.add('on');
 }
}
function setNav(n){
 nav=n;$$('nav button').forEach((b,i)=>b.classList.toggle('on',i===n));
 $$('.pg').forEach(p=>p.classList.remove('on'));
 $('.scroll').style.display=n===0?'block':'none';
 if(n===1)$('#pg-lib').classList.add('on');
 if(n===2)$('#pg-istk').classList.add('on');
 if(n===3)$('#pg-cafe').classList.add('on');
 if(n===4)$('#pg-prof').classList.add('on');
 if(n===1){const p=$('#pg-lib');p.innerHTML=`<div class="box"><h3>فروشگاه</h3><p>به زودی — کتاب‌ها و دسته‌بندی‌ها از اپ اصلی منتقل می‌شوند.</p></div>`+C.books.map(b=>`<div class="box"><h3>${b.t}</h3><p>${b.a} — ${b.cat}<br>${b.desc}</p></div>`).join('');}
 if(n===2){const p=$('#pg-istk');p.innerHTML=`<div class="box"><h3>ابزارهای تخصصی</h3><p>مودال‌ها و ابزارها به‌تدریج از اپ اصلی کپی و تمیز می‌شوند.</p></div>`+C.modals.map(m=>`<div class="box"><h3>${m.t}</h3><p>${m.s}<br>${m.b}</p></div>`).join('');}
 if(n===3){const p=$('#pg-cafe');p.innerHTML=`<div class="box"><h3>اشتراک‌ها</h3></div>`+C.plans.map(pl=>`<div class="box"><h3>${pl.t}</h3><p>${pl.price}<br>${pl.d}</p></div>`).join('');}
 if(n===4){const p=$('#pg-prof');p.innerHTML=`<div class="box"><h3>پروفایل</h3><p>ارتباط با مدیریت: @${C.brand.tg}</p><p>${C.acts.phone}</p></div>`;}
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-b],[data-c],[data-n],[data-go],#wbtn');
 if(!t)return;
 if(t.dataset.b!==undefined){bi=(bi+parseInt(t.dataset.b)+C.banners.length)%C.banners.length;render();}
 if(t.dataset.c!==undefined){ci=Math.max(0,Math.min(C.books.length-1,ci+parseInt(t.dataset.c)));render();}
 if(t.dataset.n!==undefined)setNav(+t.dataset.n);
 if(t.dataset.go){const g=t.dataset.go;if(g==='lib')setNav(1);if(g==='cafe')setNav(3);if(g==='istk')setNav(2);if(g==='comm')setNav(3);}
 if(t.id==='wbtn'){$('#wm').classList.remove('on');sessionStorage.setItem('asrar_welcomed','1');}
});
document.addEventListener('touchmove',function(e){
 if(e.target.closest('.scroll, .pg, .banner, .cv, .track')) return;
 e.preventDefault();
},{passive:false});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
render();setNav(0);
</script>
</body>
</html>
