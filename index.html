<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>کافه سرکتاب میعاد</title>
<style>
body{margin:0;background:#070B14;color:#F5F0E4;font-family:Tahoma,sans-serif}
#ld{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px}
.sp{width:36px;height:36px;border:3px solid #c9a84c;border-top-color:transparent;border-radius:50%;animation:a 1s linear infinite}
@keyframes a{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="ld"><div class="sp"></div><div>بارگذاری…</div></div>
<script>
window.__KAFE_INDEX_CHUNKS=[];
window.__KAFE_EXPECTED_CHUNKS=4;
function __kafeTryWrite(){
  if(window.__KAFE_INDEX_CHUNKS.filter(Boolean).length < window.__KAFE_EXPECTED_CHUNKS) return;
  var html = window.__KAFE_INDEX_CHUNKS.join('');
  document.open();
  document.write(html);
  document.close();
}
</script>
<script src="./index-chunk-0.js" onload="__kafeTryWrite()" onerror="document.getElementById('ld').innerHTML='خطا در بارگذاری بخش 0'"></script>
<script src="./index-chunk-1.js" onload="__kafeTryWrite()" onerror="document.getElementById('ld').innerHTML='خطا در بارگذاری بخش 1'"></script>
<script src="./index-chunk-2.js" onload="__kafeTryWrite()" onerror="document.getElementById('ld').innerHTML='خطا در بارگذاری بخش 2'"></script>
<script src="./index-chunk-3.js" onload="__kafeTryWrite()" onerror="document.getElementById('ld').innerHTML='خطا در بارگذاری بخش 3'"></script>
</body>
</html>
