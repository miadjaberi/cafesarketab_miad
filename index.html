<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>کافه سرکتاب میعاد</title>
<meta name="theme-color" content="#070B14">
<script>
(function () {
  function fail(msg) {
    document.body.innerHTML = '<p style="color:#F0D878;text-align:center;padding:40px;font-family:Tahoma;direction:rtl">' +
      (msg || 'خطا در بازیابی') + '</p>';
  }
  if (typeof DecompressionStream === 'undefined') {
    fail('مرورگر از بازیابی پشتیبانی نمی‌کند. لطفاً کروم به‌روز استفاده کنید.');
    return;
  }
  Promise.all([
    fetch('./_restore/gz_a.b64?v=2').then(function(r){ if(!r.ok) throw new Error('a'); return r.text(); }),
    fetch('./_restore/gz_b.b64?v=2').then(function(r){ if(!r.ok) throw new Error('b'); return r.text(); })
  ]).then(function(parts){
    var b64 = (parts[0]+parts[1]).replace(/\s+/g,'');
    var bin = Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); });
    var ds = new DecompressionStream('gzip');
    var stream = new Response(bin).body.pipeThrough(ds);
    return new Response(stream).text();
  }).then(function(html){
    document.open();
    document.write(html);
    document.close();
  }).catch(function(e){
    fail('بازیابی ناموفق: ' + (e && e.message ? e.message : e));
  });
})();
</script>
</head>
<body style="background:#070B14;color:#F0D878;font-family:Tahoma;text-align:center;padding:40px;direction:rtl">
<p>در حال بازیابی کافه سرکتاب میعاد…</p>
</body>
</html>
